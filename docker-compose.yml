# Local development only — REQ-001's durable job queue, run as real Redis
# Streams rather than mocked, so tests exercise actual XADD/XREADGROUP/XACK
# behavior. Not used in production deploy (STORY-010 covers that separately).
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
