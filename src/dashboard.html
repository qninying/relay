<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RELAY</title>
<style>
  /* Same tokens as assets/command-center.css — Relay's two UI surfaces read
     as one product. One accent color (blue) for interaction/neutral info;
     color otherwise communicates status only, nothing decorative. */
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #e4e6eb; --text: #14171f;
    --muted: #6b7280; --muted-2: #9aa1ac; --accent: #2f5fd6; --accent-weak: #eaf0ff;
    --ok: #1a8a5f; --ok-weak: #e7f5ee;
    --warn: #b5680a; --warn-weak: #fdf3e3;
    --danger: #c23b3b; --danger-weak: #fbeaea;
    --neutral: #6b7280; --neutral-weak: #eef0f3;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  .conn-dot.offline { background: var(--danger); }
  #updated {
    font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px;
  }

  main { max-width: 1180px; margin: 0 auto; padding: 28px 32px 60px; }

  section + section { margin-top: 28px; }
  .section-label {
    font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase;
    letter-spacing: .06em; margin: 0 0 12px;
  }

  /* ---- KPI summary layer ---- */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px;
  }
  @media (max-width: 1080px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 640px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }

  .kpi-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; min-height: 108px; display: flex; flex-direction: column; justify-content: space-between;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .kpi-card:hover { box-shadow: 0 2px 8px rgba(16,24,40,.05); border-color: #d7dae1; }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; }
  .kpi-icon { width: 16px; height: 16px; color: var(--muted-2); }
  .kpi-icon svg { width: 100%; height: 100%; }
  .state-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .state-dot-healthy, .state-dot-ok { background: var(--ok); }
  .state-dot-warning { background: var(--warn); }
  .state-dot-critical { background: var(--danger); }
  .state-dot-nodata, .state-dot-offline { background: var(--muted-2); }
  .kpi-label {
    font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 8px;
  }
  .kpi-value { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-top: 2px; }
  .kpi-sub { font-size: 11.5px; color: var(--muted-2); margin-top: 1px; }

  /* ---- Operational overview ---- */
  .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 780px) { .op-grid { grid-template-columns: 1fr; } }

  .op-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; min-height: 190px; display: flex; flex-direction: column;
  }
  .op-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .op-title-group { display: flex; align-items: center; gap: 8px; }
  .op-title-group .kpi-icon { width: 15px; height: 15px; }
  .op-card h3 { margin: 0; font-size: 13px; font-weight: 700; color: var(--text); }
  .state-badge {
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 100px;
    text-transform: uppercase; letter-spacing: .03em;
  }
  .state-badge-healthy { background: var(--ok-weak); color: var(--ok); }
  .state-badge-warning { background: var(--warn-weak); color: var(--warn); }
  .state-badge-critical { background: var(--danger-weak); color: var(--danger); }
  .state-badge-nodata { background: var(--neutral-weak); color: var(--muted); }

  .op-body { flex: 1; }
  .op-foot { font-size: 12px; color: var(--muted); margin-top: 10px; }

  .budget-bar {
    height: 7px; border-radius: 100px; background: var(--bg); border: 1px solid var(--border);
    overflow: hidden; margin-bottom: 6px;
  }
  .budget-bar-fill { height: 100%; border-radius: 100px; transition: width .3s ease; }
  .fill-healthy { background: var(--ok); }
  .fill-warning { background: var(--warn); }
  .fill-critical { background: var(--danger); }
  .budget-figures { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .budget-figures strong { color: var(--text); font-weight: 700; }

  .sparkline-wrap { display: flex; align-items: flex-end; gap: 16px; }
  .spark-value { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .spark-sub { font-size: 11.5px; color: var(--muted-2); }

  .empty-inline {
    font-size: 13px; color: var(--muted-2); display: flex; align-items: center;
    justify-content: center; height: 100%; min-height: 90px;
  }

  /* ---- Attention area ---- */
  .attention-list { display: flex; flex-direction: column; gap: 8px; }
  .attention-item {
    display: flex; align-items: flex-start; gap: 12px; background: var(--panel);
    border: 1px solid var(--border); border-left: 3px solid var(--warn);
    border-radius: 10px; padding: 12px 16px;
  }
  .attention-item.critical { border-left-color: var(--danger); }
  .attention-item .kpi-icon { margin-top: 2px; color: inherit; }
  .attention-item.critical .kpi-icon { color: var(--danger); }
  .attention-item:not(.critical) .kpi-icon { color: var(--warn); }
  .attention-title { font-size: 13px; font-weight: 700; }
  .attention-desc { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .all-clear {
    display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ok);
    background: var(--ok-weak); border-radius: 10px; padding: 12px 16px;
  }

  /* ---- Loading / offline ---- */
  .skeleton-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  @media (max-width: 1080px) { .skeleton-grid { grid-template-columns: repeat(3, 1fr); } }
  .skeleton {
    background: linear-gradient(90deg, var(--panel) 25%, #eef0f3 37%, var(--panel) 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
    border-radius: var(--radius); height: 108px; border: 1px solid var(--border);
  }
  @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

  .offline-banner {
    display: flex; align-items: center; gap: 10px; background: var(--panel);
    border: 1px solid var(--border); border-left: 3px solid var(--danger);
    border-radius: 10px; padding: 14px 18px; font-size: 13px; color: var(--text);
  }
  .offline-banner .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="conn-dot" id="connDot"></span>
      <h1>RELAY</h1>
    </div>
    <div id="updated">Connecting…</div>
  </header>

  <main id="main">
    <section>
      <p class="section-label">Overview</p>
      <div class="skeleton-grid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </section>
  </main>

  <script>
    const ICON = {
      pulse: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 8 4-16 2 8h6"/></svg>',
      target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
      clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
      alertCircle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16" r=".5" fill="currentColor"/></svg>',
      shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>',
      inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h4l2 3h4l2-3h4"/><path d="M4 12l1.5-6.5A2 2 0 0 1 7.4 4h9.2a2 2 0 0 1 1.9 1.5L20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
    };

    function icon(name) { return `<span class="kpi-icon">${ICON[name]}</span>`; }
    function fmtPct(x, digits) { return x == null ? "—" : (x * 100).toFixed(digits ?? 1) + "%"; }
    function fmtMs(x) { return x == null ? "—" : x + " ms"; }

    // ---- state derivation from REAL thresholds, documented once here ----
    function budgetState(eb) {
      if (eb.allowedFailures <= 0) return eb.actualFailures > 0 ? "critical" : "healthy";
      const used = eb.actualFailures / eb.allowedFailures;
      if (used >= 1) return "critical";
      if (used >= 0.7) return "warning";
      return "healthy";
    }
    function dlqState(depth) {
      if (depth == null) return "nodata";
      if (depth >= 5) return "critical";
      if (depth >= 1) return "warning";
      return "healthy";
    }
    function worstState(states) {
      const order = { healthy: 0, nodata: 0, warning: 1, critical: 2 };
      return states.reduce((worst, s) => (order[s] > order[worst] ? s : worst), "healthy");
    }

    // ---- reusable card renderers (data-driven, not one-off markup) ----
    function kpiCard({ iconName, label, value, sub, state, title }) {
      return `
        <div class="kpi-card" ${title ? `title="${title}"` : ""}>
          <div class="kpi-top">
            ${icon(iconName)}
            <span class="state-dot state-dot-${state}"></span>
          </div>
          <div>
            <div class="kpi-value">${value}</div>
            <div class="kpi-label">${label}</div>
            <div class="kpi-sub">${sub}</div>
          </div>
        </div>
      `;
    }

    function stateBadgeLabel(state) {
      return { healthy: "Healthy", warning: "Warning", critical: "Critical", nodata: "No data" }[state];
    }

    function sparkline(samples) {
      if (!samples || samples.length < 2) {
        return '<div class="empty-inline">Not enough activity yet for a trend</div>';
      }
      const w = 100, h = 40, pad = 4;
      const durations = samples.map((s) => s.durationMs);
      const min = Math.min(...durations), max = Math.max(...durations);
      const range = max - min || 1;
      const stepX = (w - pad * 2) / (samples.length - 1);
      const points = samples.map((s, i) => {
        const x = pad + i * stepX;
        const y = h - pad - ((s.durationMs - min) / range) * (h - pad * 2);
        return { x, y, failed: s.outcome === "failure" };
      });
      const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
      const dots = points
        .filter((p) => p.failed)
        .map((p) => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.4" fill="var(--danger)"/>`)
        .join("");
      return `
        <svg viewBox="0 0 ${w} ${h}" width="100%" height="56" preserveAspectRatio="none">
          <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
          ${dots}
        </svg>
      `;
    }

    function render(s) {
      const ebState = budgetState(s.errorBudget);
      const dState = dlqState(s.dlqDepth);
      const noData = s.totalRequests === 0;
      const healthState = noData ? "nodata" : worstState([ebState, dState === "nodata" ? "healthy" : dState]);

      const kpis = [
        kpiCard({
          iconName: "pulse", label: "System health", state: healthState,
          value: noData ? "No data" : stateBadgeLabel(healthState),
          sub: noData ? "waiting for activity" : `${s.totalRequests} requests in window`,
        }),
        kpiCard({
          iconName: "target", label: "Success rate", state: noData ? "nodata" : (s.successRate >= 0.95 ? "healthy" : s.successRate >= 0.85 ? "warning" : "critical"),
          value: fmtPct(s.successRate), sub: `${s.successCount} of ${s.totalRequests} succeeded`,
        }),
        kpiCard({
          iconName: "alertCircle", label: "Failed jobs", state: s.failureCount === 0 ? "healthy" : "warning",
          value: String(s.failureCount), sub: `of ${s.totalRequests} in window`,
        }),
        kpiCard({
          iconName: "clock", label: "p95 latency", state: "nodata", value: fmtMs(s.p95LatencyMs),
          sub: "rolling window", title: "95th percentile job duration over the current window",
        }),
        kpiCard({
          // Clamped to 0% at the floor — once breached, "budget left" reads
          // as 0%, not a confusing negative number. The CRITICAL badge and
          // the red bar on the Error Budget card already show how far over.
          iconName: "shield", label: "Error budget left", state: ebState,
          value: s.errorBudget.allowedFailures > 0 ? fmtPct(Math.max(0, 1 - s.errorBudget.actualFailures / s.errorBudget.allowedFailures), 0) : "—",
          sub: `target ${(s.errorBudget.targetSuccessRate * 100).toFixed(0)}% success`,
          title: "Share of allowed failures not yet used, against the target success rate",
        }),
        kpiCard({
          iconName: "inbox", label: "DLQ backlog", state: dState,
          value: s.dlqDepth == null ? "—" : String(s.dlqDepth),
          sub: s.dlqDepth == null ? "not connected" : "awaiting triage",
        }),
      ].join("");

      const usedRatio = s.errorBudget.allowedFailures > 0 ? s.errorBudget.actualFailures / s.errorBudget.allowedFailures : (s.errorBudget.actualFailures > 0 ? 1 : 0);
      const barWidth = Math.min(usedRatio, 1) * 100;
      const fillClass = ebState === "critical" ? "fill-critical" : ebState === "warning" ? "fill-warning" : "fill-healthy";

      const opCards = `
        <div class="op-card">
          <div class="op-head">
            <div class="op-title-group">${icon("shield")}<h3>Error budget</h3></div>
            <span class="state-badge state-badge-${ebState}">${stateBadgeLabel(ebState)}</span>
          </div>
          <div class="op-body">
            <div class="budget-bar"><div class="budget-bar-fill ${fillClass}" style="width:${barWidth}%;"></div></div>
            <div class="budget-figures">
              <span><strong>${s.errorBudget.actualFailures}</strong> failures used</span>
              <span><strong>${s.errorBudget.allowedFailures.toFixed(2)}</strong> allowed</span>
            </div>
          </div>
          <div class="op-foot">Target ${(s.errorBudget.targetSuccessRate * 100).toFixed(0)}% success rate over the last ${s.windowSize} requests.</div>
        </div>

        <div class="op-card">
          <div class="op-head">
            <div class="op-title-group">${icon("pulse")}<h3>Recent activity</h3></div>
          </div>
          <div class="op-body">
            <div class="sparkline-wrap">
              <div style="flex:1;">${sparkline(s.recentSamples)}</div>
            </div>
          </div>
          <div class="op-foot">Last ${s.recentSamples.length} job${s.recentSamples.length === 1 ? "" : "s"} — line shows duration, red dots mark failures. Not a 24h/7d view: nothing is persisted across restarts yet.</div>
        </div>
      `;

      const attentionItems = [];
      if (ebState === "critical") {
        attentionItems.push({
          critical: true, title: "Error budget breached",
          desc: `${s.errorBudget.actualFailures} failures against ${s.errorBudget.allowedFailures.toFixed(2)} allowed for the ${(s.errorBudget.targetSuccessRate * 100).toFixed(0)}% target.`,
        });
      } else if (ebState === "warning") {
        attentionItems.push({
          critical: false, title: "Error budget usage rising",
          desc: `${s.errorBudget.actualFailures} of ${s.errorBudget.allowedFailures.toFixed(2)} allowed failures used — approaching the SLO limit.`,
        });
      }
      if (dState === "critical" || dState === "warning") {
        attentionItems.push({
          critical: dState === "critical", title: `${s.dlqDepth} job${s.dlqDepth === 1 ? "" : "s"} in the dead-letter queue`,
          desc: "See docs/runbooks/DLQ_TRIAGE.md to triage — check the failure reason before resubmitting.",
        });
      }

      const attention = attentionItems.length
        ? `<div class="attention-list">${attentionItems
            .map(
              (a) => `
              <div class="attention-item ${a.critical ? "critical" : ""}">
                ${icon("alertCircle")}
                <div>
                  <div class="attention-title">${a.title}</div>
                  <div class="attention-desc">${a.desc}</div>
                </div>
              </div>`
            )
            .join("")}</div>`
        : `<div class="all-clear">${icon("check")}<span>All systems within budget. Nothing needs attention.</span></div>`;

      document.getElementById("main").innerHTML = `
        <section>
          <p class="section-label">Overview</p>
          <div class="kpi-grid">${kpis}</div>
        </section>
        <section>
          <p class="section-label">Operational detail</p>
          <div class="op-grid">${opCards}</div>
        </section>
        <section>
          <p class="section-label">Needs attention</p>
          ${attention}
        </section>
      `;
    }

    async function refresh() {
      try {
        const res = await fetch("/metrics", { cache: "no-store" });
        const s = await res.json();
        render(s);
        document.getElementById("connDot").classList.remove("offline");
        document.getElementById("updated").textContent = "Updated " + new Date().toLocaleTimeString();
      } catch (e) {
        document.getElementById("main").innerHTML = `
          <div class="offline-banner">
            ${icon("alertCircle")}
            <div>
              <div>Can't reach the dashboard server.</div>
              <div class="sub">Retrying automatically — check that the server is still running.</div>
            </div>
          </div>
        `;
        document.getElementById("connDot").classList.add("offline");
        document.getElementById("updated").textContent = "Disconnected";
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
